version: '3'

tasks:
  image-guard:
    desc: Watch repository image state and emit JSONL snapshots
    silent: true
    preconditions:
      - sh: command -v inotifywait
        msg: watch requires inotifywait
      - sh: command -v file
        msg: watch requires file
      - sh: command -v identify
        msg: watch requires identify
      - sh: command -v bun
        msg: watch requires bun
    cmds:
      - exec bun .omp/image-guard/watch.ts
  model:acquire:
    desc: Acquire and verify the pinned extension model bundle
    cmds:
      - uv run --project model-tools model-tools acquire --manifest model-tools/model-sources/mobilenetv2-12.toml --output-dir extension/public/models

  model:verify:
    desc: Verify the existing extension model bundle offline
    cmds:
      - uv run --project model-tools model-tools verify --manifest model-tools/model-sources/mobilenetv2-12.toml --bundle-dir extension/public/models
