services:
  # The evaluator writes all runtime state to the persistent named volume.
  evaluator:
    build:
      context: ..
      dockerfile: validation/Dockerfile
    gpus: all
    cpus: 4
    command: ["all"]
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - spidey-sense-evaluation-data:/data

volumes:
  # An explicit name avoids project-name prefixes and keeps this volume stable.
  spidey-sense-evaluation-data:
    name: spidey-sense-evaluation-data
